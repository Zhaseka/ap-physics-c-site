18px;margin:20px 0 8px}.hero p{max-width:780px;margin-bottom:0}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin:0 0 18px}.tag{display:inline-block;font-size:12px;background:#edf1f6;color:#3e5a7a;padding:3px 9px;border-radius:20px;margin-right:5px}.tag.import{background:#fdf1e2;color:#8a5a1c}.tag.shared{background:#e5f4ea;color:#256b42}.btn.sm{padding:5px 10px;font-size:13px}.ovl{position:fixed;inset:0;background:rgba(20,28,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.ovl-box{background:#fff;border-radius:16px;padding:26px;max-width:430px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}.ovl-box input{margin:12px 0 4px}.who{font-size:13px;margin-bottom:12px;padding:8px 10px;background:var(--pale);border-radius:10px}.rowbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-align:left}.detail td{background:#f8fafd}#previewPanel select{max-width:170px}.pq{min-height:64px;font:14px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;padding:8px}.popt{display:flex;gap:6px;align-items:center;margin-top:4px}.popt input{padding:5px 8px;font-size:14px}#previewPanel td:nth-child(2){min-width:280px}.thumb{display:block;max-width:min(320px,100%);max-height:220px;border:1px solid var(--line);border-radius:8px;background:#fff}.qimg{display:block;max-width:100%;max-height:560px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}.code{background:#1f2633;color:#eef3fa;border-radius:12px;padding:16px;overflow:auto;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.note{border-left:3px solid var(--accent);padding:9px 14px;background:#f1f5fa;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mini{border:1px solid var(--line);padding:14px;border-radius:12px}.mini strong{display:block}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-weight:650;color:var(--ink)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ghost{border-color:transparent;color:var(--bad);font-weight:600}.btn:disabled{opacity:.5}.task{padding:20px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0;padding-top:4px}.task-title{font-weight:600;margin:8px 0}.choices{display:grid;gap:7px;margin:10px 0}.choice{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.choice:has(input:checked){background:var(--pale);border-color:#8fa9c8}.choice.right{border-color:#5c9f74;background:#eaf6ee}.choice.wrong{border-color:#cf7d70;background:#fbeeec}.choice input{margin-top:5px}.feedback{font-size:13px;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}textarea,input[type=text],input[type=number]{width:100%;border:1px solid #cbd3de;border-radius:9px;padding:11px;font:inherit}textarea{min-height:190px;font-family:ui-monospace,monospace;font-size:13px}input[type=number]{width:90px}.progress{height:9px;background:#e4e8ee;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .3s}.truth{border-collapse:collapse;width:100%}.truth th,.truth td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.truth th{background:#eef3f9}.filter{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filter button{border:1px solid var(--line);border-radius:20px;padding:7px 13px;background:#fff}.filter button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.foot{font-size:12px;color:var(--muted);padding:16px 0 40px}details{border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin:10px 0}summary{cursor:pointer;font-weight:700}select{padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;max-width:100%}.drop{border:2px dashed #b9c7d8;border-radius:14px;padding:26px;text-align:center;background:#f8fafd;margin-bottom:12px}.drop.over{background:var(--pale);border-color:var(--accent)}.msg{margin-top:10px;font-weight:600;color:#244a70}.bar2{height:8px;background:#e4e8ee;border-radius:10px;overflow:hidden;min-width:80px}.bar2>div{height:100%;background:var(--accent)}.sticky{position:sticky;top:70px;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.big{font-size:40px;font-weight:800;line-height:1.1}.check{display:inline-flex;gap:6px;align-items:center;margin:4px 12px 4px 0}code{background:#eef2f7;border-radius:5px;padding:1px 5px;font-size:.92em}.code code{background:none;padding:0}

const L=['A','B','C','D','E'];
const UNITS=[
{id:'1',c:'Mechanics',name:'Kinematics',sub:'Position, velocity, acceleration, calculus-based motion, projectiles',
kw:[['velocity',1],['accelerat',1],['displacement',2],['projectile',3],['kinematic',3],['speed',.5],['position',1],['free.?fall|freely falling',2],['thrown|launched|dropped',1.5],['x\\(t\\)|v\\(t\\)|a\\(t\\)',2],['relative velocity',3],['horizontal(ly)?',1]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Derivatives</strong>v = dx/dt, a = dv/dt = d²x/dt²</div><div class="mini"><strong>Integrals</strong>x = x₀ + ∫v dt, v = v₀ + ∫a dt — area under a graph</div><div class="mini"><strong>Constant acceleration only</strong>The “big three” equations below need a = const.</div><div class="mini"><strong>Projectiles</strong>x and y are independent; aₓ = 0, a_y = −g</div></div><h3>Equations</h3><div class="code">v = v₀ + a·t
x = x₀ + v₀·t + ½·a·t²
v² = v₀² + 2a·Δx
Range on level ground: R = v₀²·sin(2θ)/g</div><div class="note"><strong>Русское пояснение:</strong> Скорость — производная координаты, ускорение — производная скорости. Если ускорение зависит от времени, используйте интегралы, а не формулы равноускоренного движения.</div>`},
{id:'2',c:'Mechanics',name:'Force and Translational Dynamics',sub:'Newton’s laws, friction, drag, circular motion, gravitation',
kw:[['force',1],['friction',2.5],['tension',2.5],['newton',1.5],['incline',2],['normal force',2.5],['drag|resistive|terminal',3],['pulley|atwood',2.5],['free.?body',3],['circular motion|centripetal',2.5],['gravitation|orbit|satellite',2],['μ(?![0₀])|coefficient of',1.5],['-bv|−bv|kv',2]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Newton’s 2nd law</strong>ΣF = m·a (vector, apply per axis)</div><div class="mini"><strong>Friction</strong>f_s ≤ μ_s·N, f_k = μ_k·N</div><div class="mini"><strong>Circular motion</strong>a_c = v²/r toward the center</div><div class="mini"><strong>Gravitation</strong>F = G·m₁m₂/r²</div></div><h3>Resistive force F = −bv</h3><div class="code">m·dv/dt = mg − bv
v(t) = v_T·(1 − e^(−t/τ)),  v_T = mg/b,  τ = m/b</div><div class="note"><strong>Русское пояснение:</strong> Нарисуйте диаграмму сил, выберите оси и запишите второй закон Ньютона по каждой оси. При сопротивлении среды получается дифференциальное уравнение и экспонента.</div>`},
{id:'3',c:'Mechanics',name:'Work, Energy, and Power',sub:'Work integrals, potential energy functions, conservation of energy, power',
kw:[['work',2],['kinetic energy',2],['potential energy',2.5],['power',2],['conservative',2.5],['joule',1],['energy',1],['u\\(x\\)',3],['equilibrium',1],['watt',2]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Work</strong>W = ∫F·dx</div><div class="mini"><strong>Work–energy theorem</strong>W_net = ΔK</div><div class="mini"><strong>Force from potential</strong>F = −dU/dx; stable equilibrium at a minimum of U</div><div class="mini"><strong>Power</strong>P = dW/dt = F·v</div></div><h3>Potential energies</h3><div class="code">Spring:      U = ½·k·x²
Gravity (near Earth): U = m·g·h
Gravity (general):    U = −G·M·m/r
Conservation: K₁ + U₁ + W_nc = K₂ + U₂</div><div class="note"><strong>Русское пояснение:</strong> Работа — интеграл силы по перемещению. Сила равна минус производной потенциальной энергии; устойчивое равновесие — минимум U(x).</div>`},
{id:'4',c:'Mechanics',name:'Linear Momentum',sub:'Impulse, conservation of momentum, collisions, center of mass',
kw:[['momentum',2.5],['impulse',3],['collision|collide',3],['center of mass|centre of mass',3],['elastic',1.5],['explo',2],['recoil',2],['sticks? together',3]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Momentum</strong>p = m·v</div><div class="mini"><strong>Impulse</strong>J = ∫F dt = Δp (area under F–t graph)</div><div class="mini"><strong>Conservation</strong>If ΣF_ext = 0, total p is constant</div><div class="mini"><strong>Collisions</strong>Elastic: K conserved. Inelastic: K not conserved.</div></div><h3>Center of mass</h3><div class="code">x_cm = Σ mᵢxᵢ / M
x_cm = (1/M)·∫x dm,  dm = λ dx
F_ext = M·a_cm</div><div class="note"><strong>Русское пояснение:</strong> Импульс сохраняется, если внешние силы скомпенсированы. В неупругом ударе кинетическая энергия теряется, а импульс — нет.</div>`},
{id:'5',c:'Mechanics',name:'Torque and Rotational Dynamics',sub:'Torque, rotational inertia, Newton’s 2nd law for rotation, static equilibrium',
kw:[['torque',3],['moment of inertia|rotational inertia',3],['angular acceleration',3],['lever',1],['rotat',1],['axis|pivot|hinge',1.5],['static equilibrium',2],['parallel.?axis',3]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Torque</strong>τ = r × F, |τ| = r·F·sinθ</div><div class="mini"><strong>2nd law for rotation</strong>Στ = I·α</div><div class="mini"><strong>Rotational inertia</strong>I = Σmr² = ∫r² dm</div><div class="mini"><strong>Parallel-axis theorem</strong>I = I_cm + M·d²</div></div><h3>Common moments of inertia</h3><table class="truth"><tr><th>Object</th><th>Axis</th><th>I</th></tr><tr><td>Thin rod</td><td>center</td><td>ML²/12</td></tr><tr><td>Thin rod</td><td>end</td><td>ML²/3</td></tr><tr><td>Hoop / thin ring</td><td>center</td><td>MR²</td></tr><tr><td>Solid disk / cylinder</td><td>center</td><td>MR²/2</td></tr><tr><td>Solid sphere</td><td>center</td><td>2MR²/5</td></tr><tr><td>Thin spherical shell</td><td>center</td><td>2MR²/3</td></tr></table><div class="note"><strong>Русское пояснение:</strong> Момент силы — вращательный аналог силы, момент инерции — аналог массы. Для равновесия: ΣF = 0 и Στ = 0 относительно любой точки.</div>`},
{id:'6',c:'Mechanics',name:'Energy and Momentum of Rotating Systems',sub:'Rotational kinetic energy, rolling, angular momentum and its conservation',
kw:[['angular momentum',4],['rolling|rolls',3],['rotational kinetic',3],['without slipping',3],['skater|spinning|spins',2],['angular velocity|angular speed',1]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Rotational KE</strong>K = ½·I·ω²</div><div class="mini"><strong>Angular momentum</strong>L = I·ω, or L = r × p for a particle</div><div class="mini"><strong>Rotational impulse</strong>τ = dL/dt; if Στ_ext = 0, L is conserved</div><div class="mini"><strong>Rolling without slipping</strong>v_cm = ω·R</div></div><h3>Rolling energy</h3><div class="code">K_total = ½·M·v² + ½·I·ω²
Rolling down a ramp from height h:
v = √( 2gh / (1 + I/(MR²)) )
Work by torque: W = ∫τ dθ</div><div class="note"><strong>Русское пояснение:</strong> При качении без проскальзывания энергия делится между поступательной и вращательной частями. Момент импульса сохраняется, если суммарный внешний момент сил равен нулю.</div>`},
{id:'7',c:'Mechanics',name:'Oscillations',sub:'Simple harmonic motion, springs, pendulums, energy in SHM',
kw:[['oscillat',3],['harmonic',3],['period',2],['pendulum',3],['amplitude',3],['frequency',2],['shm',3],['vibrat',2]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>SHM condition</strong>a = −ω²·x (restoring force ∝ displacement)</div><div class="mini"><strong>Solution</strong>x(t) = A·cos(ωt + φ)</div><div class="mini"><strong>Max values</strong>v_max = Aω, a_max = Aω²</div><div class="mini"><strong>Energy</strong>E = ½·k·A² (constant)</div></div><h3>Periods</h3><div class="code">Mass–spring:       T = 2π·√(m/k)
Simple pendulum:   T = 2π·√(L/g)
Physical pendulum: T = 2π·√(I/(m·g·d))
ω = 2π/T = 2πf</div><div class="note"><strong>Русское пояснение:</strong> Гармонические колебания возникают, когда возвращающая сила пропорциональна смещению. Период пружинного маятника не зависит от амплитуды и от g.</div>`},
{id:'8',c:'E&M',name:'Electric Charges, Fields, and Gauss’s Law',sub:'Coulomb’s law, fields of charge distributions, electric flux, Gauss’s law',
kw:[['charge',1],['coulomb',2.5],['electric field',2.5],['gauss',4],['flux',1.5],['charge density|linear charge|surface charge|λ|σ|ρ',2],['dipole',2],['gaussian',4]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Coulomb’s law</strong>F = k·q₁q₂/r², k = 1/(4πε₀)</div><div class="mini"><strong>Field</strong>E = F/q; point charge E = kq/r²</div><div class="mini"><strong>Continuous charge</strong>dE = k·dq/r², integrate by components</div><div class="mini"><strong>Gauss’s law</strong>∮E·dA = Q_enc/ε₀</div></div><h3>Results to know</h3><div class="code">Infinite line:    E = λ / (2π·ε₀·r)
Infinite plane:   E = σ / (2ε₀)
Sphere, outside:  E = kQ / r²
Uniform solid sphere, inside: E = kQ·r / R³</div><div class="note"><strong>Русское пояснение:</strong> Поток через замкнутую поверхность зависит только от заряда внутри неё. Закон Гаусса удобен при высокой симметрии: сфера, цилиндр, плоскость.</div>`},
{id:'9',c:'E&M',name:'Electric Potential',sub:'Potential, potential energy, field–potential relationship, equipotentials',
kw:[['electric potential|potential difference',3],['volt',1],['equipotential',4],['dv/dx|gradient',2],['kq/r',2],['potential',1]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Definition</strong>ΔV = −∫E·dl</div><div class="mini"><strong>Field from potential</strong>Eₓ = −dV/dx</div><div class="mini"><strong>Point charge</strong>V = kq/r (scalar — just add)</div><div class="mini"><strong>Energy</strong>U = qV, W_field = −qΔV</div></div><div class="code">Two charges: U = k·q₁q₂ / r
Equipotentials are perpendicular to E.
Moving along an equipotential takes no work.</div><div class="note"><strong>Русское пояснение:</strong> Потенциал — скалярная величина, поэтому потенциалы от разных зарядов просто складываются. Поле направлено в сторону уменьшения потенциала.</div>`},
{id:'10',c:'E&M',name:'Conductors and Capacitors',sub:'Conductors in equilibrium, capacitance, dielectrics, stored energy',
kw:[['capacit',3],['dielectric',3],['conductor|conducting',2.5],['plates?',1],['grounded',2],['spherical shell',1.5]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Conductors</strong>E = 0 inside, excess charge on surface, whole conductor is equipotential</div><div class="mini"><strong>Capacitance</strong>C = Q/V</div><div class="mini"><strong>Parallel plates</strong>C = κ·ε₀·A/d</div><div class="mini"><strong>Energy</strong>U = ½CV² = Q²/(2C)</div></div><div class="code">Parallel:  C_eq = C₁ + C₂ + …
Series:    1/C_eq = 1/C₁ + 1/C₂ + …
Isolated capacitor → Q constant
Connected to battery → V constant</div><div class="note"><strong>Русское пояснение:</strong> Внутри проводника в равновесии поле равно нулю. Важно понять, что остаётся постоянным: заряд (конденсатор отключён) или напряжение (подключён к батарее).</div>`},
{id:'11',c:'E&M',name:'Electric Circuits',sub:'Current, resistance, Kirchhoff’s rules, power, RC circuits',
kw:[['circuit',2],['resist',2.5],['current',1],['battery',2],['kirchhoff',3],['ohm|Ω',2],['series|parallel',1.5],['rc circuit|time constant',2],['ammeter|voltmeter',3],['bulb',2],['internal resistance',3]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Current & resistance</strong>I = dQ/dt, R = ρL/A, V = IR</div><div class="mini"><strong>Power</strong>P = IV = I²R = V²/R</div><div class="mini"><strong>Kirchhoff</strong>Junction: ΣI_in = ΣI_out. Loop: ΣΔV = 0</div><div class="mini"><strong>Real battery</strong>V_terminal = ε − I·r</div></div><h3>RC circuits (τ = RC)</h3><div class="code">Charging:    q(t) = Cε·(1 − e^(−t/RC)),  I(t) = (ε/R)·e^(−t/RC)
Discharging: q(t) = Q₀·e^(−t/RC)
t = 0: uncharged capacitor acts like a wire
t → ∞: capacitor acts like a break (I = 0)</div><div class="note"><strong>Русское пояснение:</strong> В момент включения незаряженный конденсатор ведёт себя как провод, а в установившемся режиме ток через него не идёт. Постоянная времени τ = RC.</div>`},
{id:'12',c:'E&M',name:'Magnetic Fields and Electromagnetism',sub:'Magnetic force, Biot–Savart law, Ampère’s law, fields of wires and solenoids',
kw:[['magnetic field',2.5],['biot|savart',4],['amp[eè]re',3],['solenoid',3],['μ[0₀]',1],['lorentz',3],['wire',1],['tesla',1.5],['cyclotron|circular path|radius of the path',2],['magnetic force',3],['toroid',3]],
theory:`<h3>Key ideas</h3><div class="grid"><div class="mini"><strong>Force on a charge</strong>F = q·v × B, radius r = mv/(qB)</div><div class="mini"><strong>Force on a wire</strong>F = I·L × B</div><div class="mini"><strong>Biot–Savart</strong>dB = (μ₀/4π)·I·dl × r̂ / r²</div><div class="mini"><strong>Ampère’s law</strong>∮B·dl = μ₀·I_enc</div></div><h3>Results to know</h3><div class="code">Long straight wire:  B = μ₀I / (2πr)

function redraw(id){const el=document.getElementById(id);if(el)el.outerHTML=taskHTML(findQ(id),el.dataset.n)}
function taskHTML(t,n){const a=state.answers[t.id],c=state.checked[t.id];const fb=c?`<span class="feedback ${c==='correct'?'good':c==='incorrect'?'bad':''}">${c==='correct'?'✓ Correct':c==='incorrect'?'✗ Incorrect — try again':'No answer key — check yourself'}</span>`:'';
return `<div class="task" id="${t.id}" data-n="${n}"><div class="small"><span class="tag">${esc(unitLabel(t.unit))}</span><span class="tag ${t.src}">${SRC[t.src]}</span>Question ${n}</div><div class="task-title">${fmt(t.q)}</div>${figHTML(t)}<div class="choices">${t.opts.map((o,i)=>`<label class="choice ${c&&c!=='nokey'&&t.ans===i&&c==='correct'?'right':''} ${c==='incorrect'&&a===i?'wrong':''}"><input type="radio" name="r_${t.id}" ${a===i?'checked':''} onchange="pick('${t.id}',${i})"><span><strong>${L[i]}.</strong> ${fmt(o)}</span></label>`).join('')}</div><div class="actions"><button class="btn primary" onclick="check('${t.id}')">Check answer</button>${fb}${t.src==='import'||(t.src==='shared'&&state.teacher)?`<span style="margin-left:auto"></span><select title="Move to unit" onchange="moveQ('${t.id}',this.value)">${unitOptions(t.unit)}</select><button class="btn ghost" onclick="delQ('${t.id}')">Delete</button>${imgControls('q:'+t.id,!!t.img)}`:''}</div>${c==='correct'||c==='nokey'?(t.exp?`<div class="note"><strong>Explanation:</strong> ${fmt(t.exp)}</div>`:''):c==='incorrect'?`<div class="note small">Look again at the key equations for this unit and try a different option.</div>`:''}</div>`}
function taskSection(arr){const fl=['All','Unanswered','Wrong','From teacher','Built-in','My imports'];const v=arr.filter(t=>{const c=state.checked[t.id];switch(state.filter){case'Unanswered':return!c;case'Wrong':return c==='incorrect';case'Built-in':return t.src==='builtin';case'From teacher':return t.src==='shared';case'My imports':return t.src==='import';default:return true}});return `<div class="filter">${fl.map(l=>`<button class="${state.filter===l?'active':''}" onclick="state.filter='${l}';render()">${l}</button>`).join('')}</div><div class="panel"><p class="small">Showing ${v.length} of ${arr.length} questions. Select an answer, then check. Explanations appear after a correct answer.</p>${v.length?v.map((t,i)=>taskHTML(t,i+1)).join(''):'<p>No questions here yet. <button class="btn" onclick="setSection(\'import\')">Import MCQ</button></p>'}</div>`}

// ---------- Test mode ----------
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function presetUnits(kind){document.querySelectorAll('.tu').forEach(x=>{const u=unitOf(x.value);x.checked=kind==='all'||(u&&u.c===kind)})}
function startTest(){const units=[...document.querySelectorAll('.tu:checked')].map(x=>x.value);const n=Math.max(1,+document.getElementById('tn').value||10);const only=document.getElementById('tonly').checked;const timed=document.getElementById('ttime').checked;let pool=allQ().filter(t=>units.includes(t.unit)&&t.ans!=null);if(only)pool=pool.filter(t=>state.checked[t.id]!=='correct');if(!pool.length){alert('No gradable questions match these settings. Import more MCQ or choose other units.');return}pool=shuffle(pool).slice(0,n);state.test={ids:pool.map(t=>t.id),ans:{},done:false,start:Date.now(),limit:timed?pool.length*120:0};setSection('test')}
function testPick(id,i){state.test.ans[id]=i;const el=document.getElementById('tAnswered');if(el)el.textContent=Object.keys(state.test.ans).length}
function submitTest(auto){const T=state.test;if(!T||T.done)return;const left=T.ids.length-Object.keys(T.ans).length;if(!auto&&left&&!confirm(left+' question(s) unanswered. Submit anyway?'))return;T.done=true;T.elapsed=Math.round((Date.now()-T.start)/1000);T.ids.forEach(id=>{const t=findQ(id);if(t&&T.ans[id]!=null){state.answers[id]=T.ans[id];state.checked[id]=T.ans[id]===t.ans?'correct':'incorrect'}});save();queueResult(T);render();window.scrollTo(0,0)}
function quitTest(){if(state.test&&!state.test.done&&!confirm('Cancel this test? Answers will not be saved.'))return;state.test=null;setSection('assessment')}
function mmss(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
setInterval(()=>{const T=state.test,el=document.getElementById('timer');if(!T||T.done||!el)return;const s=Math.floor((Date.now()-T.start)/1000);if(T.limit){if(T.limit-s<=0){submitTest(true);return}el.textContent=mmss(T.limit-s)}else el.textContent=mmss(s)},1000);
function testPage(){const T=state.test;const qs=T.ids.map(findQ).filter(Boolean);
if(!T.done)return `<div class="hero"><div class="eyebrow">Practice test</div><h1>${qs.length} mixed questions</h1><p>No feedback until you submit. ${T.limit?'AP pacing: 2 minutes per question; the test submits itself when time runs out.':''}</p></div><div class="panel sticky"><span>Answered <b id="tAnswered">${Object.keys(T.ans).length}</b> / ${qs.length}</span><span>${T.limit?'Time left':'Elapsed'} <b id="timer">${T.limit?mmss(T.limit):'0:00'}</b></span><span style="margin-left:auto"></span><button class="btn" onclick="quitTest()">Cancel</button><button class="btn primary" onclick="submitTest()">Submit test</button></div><div class="panel">${qs.map((t,i)=>`<div class="task"><div class="small"><span class="tag">${esc(unitLabel(t.unit))}</span>Question ${i+1}</div><div class="task-title">${fmt(t.q)}</div>${figHTML(t)}<div class="choices">${t.opts.map((o,j)=>`<label class="choice"><input type="radio" name="t_${t.id}" ${T.ans[t.id]===j?'checked':''} onchange="testPick('${t.id}',${j})"><span><strong>${L[j]}.</strong> ${fmt(o)}</span></label>`).join('')}</div></div>`).join('')}<div class="actions"><button class="btn primary" onclick="submitTest()">Submit test</button></div></div>`;
const right=qs.filter(t=>T.ans[t.id]===t.ans).length;const pct=Math.round(right/qs.length*100);const by={};qs.forEach(t=>{by[t.unit]=by[t.unit]||{n:0,r:0};by[t.unit].n++;if(T.ans[t.id]===t.ans)by[t.unit].r++});
return `<div class="hero"><div class="eyebrow">Test results</div><h1>${right} / ${qs.length} correct · ${pct}%</h1><p>Time: ${mmss(T.elapsed)}. Results were added to your progress.</p><p id="sentStatus" style="font-weight:600">${sentText()}</p></div><div class="panel"><h2>By unit</h2><table class="truth"><tr><th>Unit</th><th>Correct</th><th style="width:40%"></th></tr>${Object.keys(by).sort((a,b)=>a-b).map(u=>`<tr><td>${esc(unitLabel(u))}</td><td>${by[u].r} / ${by[u].n}</td><td><div class="bar2"><div style="width:${by[u].r/by[u].n*100}%"></div></div></td></tr>`).join('')}</table><div class="actions"><button class="btn primary" onclick="setSection('assessment')">New test</button><button class="btn" onclick="state.test=null;setSection('assessment')">Close results</button></div></div><div class="panel"><h2>Review</h2>${qs.map((t,i)=>{const a=T.ans[t.id];return `<div class="task"><div class="small"><span class="tag">${esc(unitLabel(t.unit))}</span>Question ${i+1} · <span class="${a===t.ans?'good':'bad'}">${a===t.ans?'Correct':a==null?'Not answered':'Incorrect'}</span></div><div class="task-title">${fmt(t.q)}</div>${figHTML(t)}<div class="choices">${t.opts.map((o,j)=>`<div class="choice ${j===t.ans?'right':''} ${a===j&&j!==t.ans?'wrong':''}"><span><strong>${L[j]}.</strong> ${fmt(o)}${j===t.ans?' ✓':''}${a===j&&j!==t.ans?' (your answer)':''}</span></div>`).join('')}</div>${t.exp?`<div class="note"><strong>Explanation:</strong> ${fmt(t.exp)}</div>`:''}</div>`}).join('')}</div>`}

// ---------- Pages ----------
function sidebar(){const grp=c=>UNITS.filter(u=>u.c===c).map(u=>`<button class="${state.section===u.id?'active':''}" onclick="setSection('${u.id}')"><span><span class="small">Unit ${u.id}</span><br>${u.name}</span><span class="cnt">${inUnit(u.id).length}</span></button>`).join('');const uns=inUnit('0').length;return `${state.user?`<div class="who">Signed in as <b>${esc(state.user)}</b> · <a href="#" onclick="switchUser();return false">change</a></div>`:''}<h3>Mechanics</h3>${grp('Mechanics')}<h3>Electricity &amp; Magnetism</h3>${grp('E&M')}${uns?`<h3>Other</h3><button class="${state.section==='0'?'active':''}" onclick="setSection('0')"><span>Unsorted</span><span class="cnt">${uns}</span></button>`:''}<h3>Tools</h3><button class="${state.section==='import'?'active':''}" onclick="setSection('import')"><span>⬆ Import MCQ</span></button><button class="${state.section==='assessment'?'active':''}" onclick="setSection('assessment')"><span>Results &amp; test</span></button><button class="${state.section==='teacher'?'active':''}" onclick="setSection('teacher')"><span>${state.teacher?'Teacher mode ✓':'Teacher mode'}</span></button>`}
function homePage(){const card=u=>`<div class="panel"><span class="tag">Unit ${u.id}</span><span class="small">${inUnit(u.id).length} questions</span><h3>${u.name}</h3><p>${u.sub}</p><button class="btn primary" onclick="setSection('${u.id}')">Open unit</button></div>`;return `<section class="hero"><div class="eyebrow">AP-style learning experience</div><h1>AP Physics C: Mechanics &amp; E&amp;M</h1><p>13 units with key equations and worked ideas. Import your own multiple-choice questions (text, PDF, CSV or JSON) — the lab sorts them into units automatically, checks answers and builds timed practice tests. Questions published by your teacher appear here automatically; your own imports and progress are saved in this browser.</p><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="setSection('import')">⬆ Import MCQ</button><button class="btn" onclick="setSection('assessment')">Start a practice test</button></div></section><h2>Mechanics</h2><div class="grid">${UNITS.filter(u=>u.c==='Mechanics').map(card).join('')}</div><h2>Electricity &amp; Magnetism</h2><div class="grid">${UNITS.filter(u=>u.c==='E&M').map(card).join('')}</div><div class="panel"><h3>Suggested route</h3><p>Read a unit’s key ideas → solve its questions → import more MCQ from your teacher or prep book → take a mixed timed test → review weak units in Results.</p></div>`}
function unitPage(id){if(id==='0')return `<section class="hero"><div class="eyebrow">Imported</div><h1>Unsorted questions</h1><p>The lab could not tell which unit these belong to. Use the unit menu on each question to move it.</p></section>`+taskSection(inUnit('0'));const u=unitOf(id);const qs=inUnit(id);return `<section class="hero"><div class="eyebrow">Unit ${u.id} · ${u.c==='E&M'?'Electricity & Magnetism':'Mechanics'}</div><h1>${u.name}</h1><p>${u.sub}</p></section><section class="panel">${u.theory}</section><section class="panel"><h2>Practice · ${qs.length} questions</h2><p>${qs.filter(t=>t.src==='shared').length} from teacher, ${qs.filter(t=>t.src==='builtin').length} built-in and ${qs.filter(t=>t.src==='import').length} your own. <button class="btn" onclick="setSection('import')">Import more</button></p></section>`+taskSection(qs)}
function importPage(){const pv=state.preview;return `<div class="hero"><div class="eyebrow">Question bank</div><h1>Import MCQ</h1><p>Upload a file or paste questions. Each question is assigned to a unit by its <code>Topic:</code> line or, if there is none, by physics keywords (friction → Unit 2, Gauss → Unit 8, Faraday → Unit 13…). You can change any unit before adding.</p>${state.teacher?'<div class="note"><strong>Teacher mode is on.</strong> Questions you publish appear for everyone who opens the site.</div>':'<p class="small" style="margin-top:8px">Questions you import here are saved only in your browser. Teachers publish for everyone in <a href="#" onclick="setSection(\'teacher\');return false">Teacher mode</a>.</p>'}</div><div class="panel"><h2>1. Load questions</h2><div class="drop" id="drop"><strong>Drop a file here</strong> <span class="small">(.txt, .pdf, .csv, .json, .md)</span><br><br><label class="btn primary">Choose file<input type="file" id="file" hidden accept=".txt,.md,.csv,.json,.pdf,text/plain,application/json,application/pdf"></label></div><textarea id="paste" placeholder="…or paste MCQ text here" oninput="state.paste=this.value">${esc(state.paste)}</textarea><div class="actions"><label class="small">Unit for these questions&nbsp;<select id="forceUnit"><option value="auto">Auto-detect by topic/keywords</option>${UNITS.map(u=>`<option value="${u.id}" ${state.force===u.id?'selected':''}>Unit ${u.id} · ${u.name}</option>`).join('')}</select></label><button class="btn primary" onclick="parseInput()">Parse questions</button><button class="btn" onclick="state.paste=EXAMPLE;render()">Load example</button></div>${state.impMsg?`<div class="msg">${esc(state.impMsg)}</div>`:''}<details><summary>Supported formats</summary><p><strong>Plain text / PDF</strong> — numbered questions, lettered options <code>A)</code> <code>A.</code> or <code>(A)</code>. The answer can be given as <code>Answer: B</code> / <code>Ответ: B</code>, by marking the option with <code>*</code>, or in an <code>Answer key:</code> block at the end (<code>1. B 2. D …</code>). Optional lines: <code>Topic: Unit 5</code> and <code>Explanation: …</code>.</p><div class="code">1. A 2 kg ball moves at 3 m/s. What is its momentum?
A) 1.5 kg·m/s
B) 6 kg·m/s
C) 9 kg·m/s
D) 18 kg·m/s
Answer: B
Topic: Linear Momentum</div><p><strong>CSV</strong> — header row: <code>question,A,B,C,D,answer,topic,explanation</code></p><p><strong>JSON</strong> — <code>[{"question":"…","options":["…","…"],"answer":"B","topic":"Unit 4","explanation":"…"}]</code></p><p class="small">PDF: text is extracted, and when a question contains a diagram or graph, a picture of that part of the page is attached automatically. You can also attach a screenshot or image file to any question. The PDF reader is downloaded the first time you use it (needs internet). Scanned PDFs (images) contain no text and cannot be read.</p></details></div>${pv.length?`<div class="panel" id="previewPanel"><h2>2. Check &amp; add (${pv.filter(p=>p.inc).length} selected)</h2><p class="small">Figures: when a PDF question contains a drawing or graph, a snippet of the original page is attached automatically. You can fix any text that came out wrong (e.g. graph labels glued to an option) right in the boxes. To add or replace a figure, copy a screenshot (Mac: ⌘+Ctrl+Shift+4) and click <b>Paste screenshot</b>, or choose a file.</p><div style="overflow:auto"><table class="truth"><tr><th><input type="checkbox" ${pv.every(p=>p.inc)?'checked':''} onchange="state.preview.forEach(p=>p.inc=this.checked);render()"></th><th>Question</th><th>Answer</th><th>Unit</th></tr>${pv.map((p,i)=>`<tr><td><input type="checkbox" ${p.inc?'checked':''} onchange="state.preview[${i}].inc=this.checked"></td><td><textarea class="pq" oninput="state.preview[${i}].q=this.value">${esc(p.q)}</textarea>${p.opts.map((o,j)=>`<div class="popt"><b>${L[j]}</b><input type="text" value="${esc(o)}" oninput="state.preview[${i}].opts[${j}]=this.value"></div>`).join('')}${p.img?`<img class="thumb" style="margin-top:8px" src="${esc(safeImg(p.img))}" alt="">`:''}<div class="actions" style="margin-top:6px">${imgControls('p:'+i,!!p.img,p.crop&&!p.img?`<button class="btn sm" onclick="state.preview[${i}].img=state.preview[${i}].crop;render()">Use PDF snippet</button>`:'')}</div></td><td><select onchange="state.preview[${i}].ans=this.value===''?null:+this.value"><option value="">—</option>${p.opts.map((o,j)=>`<option value="${j}" ${p.ans===j?'selected':''}>${L[j]}</option>`).join('')}</select></td><td><select onchange="state.preview[${i}].unit=this.value">${unitOptions(p.unit)}</select></td></tr>`).join('')}</table></div><div class="actions">${state.teacher?'<button class="btn primary" onclick="publishPreview()">Publish selected to everyone</button><button class="btn" onclick="addPreview()">Add to my bank only</button>':'<button class="btn primary" onclick="addPreview()">Add selected to my bank</button>'}<button class="btn" onclick="state.preview=[];state.impMsg='';render()">Discard</button></div></div>`:''}<div class="panel"><h2>Your bank</h2><p>${BUILTIN_Q.length} built-in + <strong>${state.shared.length}</strong> from teacher + <strong>${state.bank.length}</strong> your own imports (visible only to you).</p><div class="grid3">${UNITS.map(u=>`<div class="small">Unit ${u.id}: ${state.bank.filter(t=>t.unit===u.id).length} imported</div>`).join('')}${inUnit('0').length?`<div class="small">Unsorted: ${inUnit('0').length}</div>`:''}</div><div class="actions"><button class="btn" onclick="exportBank()" ${state.bank.length?'':'disabled'}>Export bank (.json)</button><button class="btn ghost" onclick="clearBank()" ${state.bank.length?'':'disabled'}>Remove all imported</button></div></div>`}
function bindImport(){const drop=document.getElementById('drop'),file=document.getElementById('file');if(!drop)return;file.onchange=e=>{if(e.target.files[0])handleFile(e.target.files[0])};['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)handleFile(f)})}
function assessmentPage(){const all=allQ();const rows=UNITS.map(u=>{const q=all.filter(t=>t.unit===u.id);const att=q.filter(t=>state.checked[t.id]==='correct'||state.checked[t.id]==='incorrect');const r=att.filter(t=>state.checked[t.id]==='correct').length;return{u,n:q.length,att:att.length,r,pct:att.length?Math.round(r/att.length*100):null}});const attT=rows.reduce((s,x)=>s+x.att,0),rT=rows.reduce((s,x)=>s+x.r,0);const weak=rows.filter(x=>x.att>=2&&x.pct<70).sort((a,b)=>a.pct-b.pct).slice(0,3);
return `<div class="hero"><div class="eyebrow">Formative assessment</div><h1>Results &amp; practice test</h1><p>Accuracy is based on the questions you have checked. This is practice, not an official AP score.</p></div><div class="grid"><div class="panel"><div class="small">Accuracy (checked questions)</div><div class="big">${attT?Math.round(rT/attT*100)+'%':'—'}</div><div class="small">${rT} correct of ${attT} checked</div></div><div class="panel"><div class="small">Focus next on</div>${weak.length?weak.map(x=>`<div><button class="btn" style="margin:4px 0" onclick="setSection('${x.u.id}')">Unit ${x.u.id} · ${x.u.name} — ${x.pct}%</button></div>`).join(''):'<p>Check at least 2 questions in a unit to see weak spots.</p>'}</div></div><div class="panel"><h2>Build a practice test</h2><div class="actions"><button class="btn" onclick="presetUnits('Mechanics')">Mechanics</button><button class="btn" onclick="presetUnits('E&M')">E&amp;M</button><button class="btn" onclick="presetUnits('all')">All units</button></div><div style="margin:12px 0">${UNITS.map(u=>`<label class="check"><input type="checkbox" class="tu" value="${u.id}" checked> ${u.id}. ${u.name} <span class="small">(${inUnit(u.id).filter(t=>t.ans!=null).length})</span></label>`).join('')}${inUnit('0').length?`<label class="check"><input type="checkbox" class="tu" value="0"> Unsorted</label>`:''}</div><div class="actions"><label>Questions <input type="number" id="tn" value="15" min="1" max="200"></label><label class="check"><input type="checkbox" id="ttime" checked> Timed (2 min / question)</label><label class="check"><input type="checkbox" id="tonly"> Skip questions I already got right</label><button class="btn primary" onclick="startTest()">Start test</button>${state.test?`<button class="btn" onclick="setSection('test')">${state.test.done?'Last results':'Resume test'}</button>`:''}</div><p class="small">Questions without an answer key are not included in tests.</p></div><div class="panel"><h2>Progress by unit</h2><div style="overflow:auto"><table class="truth"><tr><th>Unit</th><th>Questions</th><th>Checked</th><th>Correct</th><th style="width:28%">Accuracy</th></tr>${rows.map(x=>`<tr><td><a href="#" onclick="setSection('${x.u.id}');return false">${x.u.id}. ${x.u.name}</a></td><td>${x.n}</td><td>${x.att}</td><td>${x.r}</td><td>${x.pct==null?'—':`<div class="bar2"><div style="width:${x.pct}%"></div></div><span class="small">${x.pct}%</span>`}</td></tr>`).join('')}</table></div><div class="actions"><button class="btn" onclick="exportResults()">Export results (.txt)</button><button class="btn ghost" onclick="if(confirm('Clear all answers and results? Imported questions are kept.')){state.answers={};state.checked={};save();render()}">Reset progress</button></div></div>`}
function exportResults(){const lines=['AP Physics C — Practice Results','Date: '+new Date().toLocaleString(),''];UNITS.concat([{id:'0',name:'Unsorted'}]).forEach(u=>{const a=inUnit(u.id);if(!a.length)return;lines.push('Unit '+u.id+' '+u.name);a.forEach((t,i)=>lines.push(`  ${i+1}. [${t.src}] ${state.checked[t.id]||'unchecked'} | your: ${state.answers[t.id]!=null?L[state.answers[t.id]]:'-'} | key: ${t.ans!=null?L[t.ans]:'-'} | ${t.q.replace(/\s+/g,' ').slice(0,80)}`));lines.push('')});download(lines.join('\n'),'AP_Physics_C_results.txt','text/plain')}
function render(){const nav=[['home','Overview'],['theory','Formula sheet'],['practice','All questions'],['import','Import MCQ'],['assessment','Results & test'],['teacher',state.teacher?'Teacher ✓':'Teacher']];if(state.teacher)nav.push(['results','Student results']);if(state.test)nav.push(['test',state.test.done?'Test results':'● Test']);document.getElementById('nav').innerHTML=nav.map(([id,t])=>`<button class="${state.section===id?'active':''}" onclick="setSection('${id}')">${t}</button>`).join('');document.getElementById('sidebar').innerHTML=sidebar();let out;const s=state.section;
if(s==='home')out=homePage();
else if(s==='theory')out=`<div class="hero"><div class="eyebrow">Reference guide</div><h1>Key equations by unit</h1></div>`+UNITS.map(u=>`<section class="panel"><span class="tag">Unit ${u.id}</span><h2>${u.name}</h2>${u.theory}<div class="actions"><button class="btn primary" onclick="setSection('${u.id}')">Practice Unit ${u.id}</button></div></section>`).join('');
else if(s==='practice')out=`<div class="hero"><div class="eyebrow">Question bank</div><h1>All ${allQ().length} questions</h1><p>Built-in examples plus everything you imported. Use the sidebar to practice one unit.</p></div>`+taskSection(allQ());
else if(s==='import')out=importPage();
else if(s==='assessment')out=assessmentPage();
else if(s==='teacher')out=teacherPage();
else if(s==='results')out=resultsPage();
else if(s==='test'&&state.test)out=testPage();
else if(s==='0'||unitOf(s))out=unitPage(s);
else{state.section='home';out=homePage()}
document.getElementById('main').innerHTML=out+`<div class="foot">Independent AP-style practice resource • AP and College Board are trademarks of their respective owner • Your progress is saved in this browser; finished tests are sent to your teacher</div>`+loginOverlay();if(s==='import')bindImport();updateProgress();document.getElementById('uname')?.focus()}
render();loadShared();flushResults();
</script></body></html>
